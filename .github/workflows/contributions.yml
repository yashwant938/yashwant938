name: Refresh contribution calendar

on:
  schedule:
    - cron: '17 1 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/build_calendar.py'
      - 'scripts/update_contributions.py'
      - '.github/workflows/contributions.yml'

permissions:
  contents: write

concurrency:
  group: contribution-calendar
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out the current profile
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Render the public contribution calendar
        run: python3 scripts/update_contributions.py

      - name: Publish the refreshed image
        run: |
          git add assets/contributions-red.svg
          if git diff --cached --quiet; then
            echo "Contribution calendar is already current."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Refresh contribution calendar'
          git push origin HEAD:main
