<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="410" viewBox="0 0 1200 410" role="img" aria-labelledby="title desc">
<title id="title">Yashwant — Systems × GenAI</title>
<desc id="desc">Systems engineering and generative AI. C++, Linux, and LLVM meet RAG, LLM applications, and AI tooling.</desc>
<defs>
