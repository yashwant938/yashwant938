<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Yashwant — Systems software engineer</title>
  <desc id="desc">C++, Linux, compilers, and developer tools. Reproduce, understand, fix, verify.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0b1426"/><stop offset="1" stop-color="#122c39"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#6ee7c4"/><stop offset="1" stop-color="#63b3ed"/></linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M 32 0 L 0 0 0 32" fill="none" stroke="#aec8e8" stroke-opacity=".055"/></pattern>
  </defs>
  <rect width="1200" height="360" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="360" rx="18" fill="url(#grid)"/>
  <path d="M48 48H152" stroke="#6ee7c4" stroke-width="4" stroke-linecap="round"/>
  <g font-family="Segoe UI, Arial, sans-serif">
    <text x="48" y="91" fill="#8ba8c3" font-size="15" font-weight="600" letter-spacing="3">SYSTEMS SOFTWARE ENGINEER</text>
    <text x="44" y="169" fill="#f4f8ff" font-size="68" font-weight="700" letter-spacing="-2">Yashwant</text>
    <text x="48" y="210" fill="#c1d0e3" font-size="22">C++ · Linux · Compilers · Developer tools</text>
    <text x="48" y="275" fill="#75e4c4" font-size="19" font-weight="500">Understand the failure. Build the fix.</text>
    <text x="48" y="310" fill="#829db6" font-size="15">Root causes, regression tests, and reviewable work.</text>
  </g>
  <g transform="translate(705 50)" font-family="Consolas, 'Courier New', monospace">
    <rect width="446" height="260" rx="12" fill="#0a1423" stroke="#345167"/>
    <path d="M0 40H446" stroke="#293f54"/>
    <circle cx="20" cy="20" r="4" fill="#60819b"/><circle cx="35" cy="20" r="4" fill="#60819b"/><circle cx="50" cy="20" r="4" fill="#60819b"/>
    <text x="77" y="25" fill="#90acc5" font-size="13">engineering / workflow</text>
    <path d="M33 77V212" stroke="#2a5364" stroke-width="2"/>
    <g font-size="16">
      <circle cx="33" cy="79" r="5" fill="#75e4c4"/>
      <text x="56" y="85" fill="#e3edf9">01  Reproduce the behavior</text>
      <circle cx="33" cy="124" r="5" fill="#75e4c4"/>
      <text x="56" y="130" fill="#e3edf9">02  Trace the root cause</text>
      <circle cx="33" cy="169" r="5" fill="#75e4c4"/>
      <text x="56" y="175" fill="#e3edf9">03  Make a focused change</text>
      <circle cx="33" cy="214" r="5" fill="#75e4c4"/>
      <text x="56" y="220" fill="#75e4c4">04  Verify with regression tests</text>
    </g>
  </g>
</svg>
