<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="cf-title cf-desc" class="standalone">
<title id="cf-title">ContextForge MCP: deterministic token compressor and context compiler</title><desc id="cf-desc">Heavy raw logs, code files, and RAG chunks enter a floating isometric compression prism and emerge as a dense token-budgeted XML context pack with U-shaped attention ordering.</desc>
<defs>
<radialGradient id="cf-bg" cx="48%" cy="43%" r="75%"><stop stop-color="#1d2f3a"/><stop offset=".55" stop-color="#111f28"/><stop offset="1" stop-color="#0b1218"/></radialGradient>
<radialGradient id="cf-halo"><stop stop-color="#8ec5ff" stop-opacity=".18"/><stop offset="1" stop-color="#8ec5ff" stop-opacity="0"/></radialGradient>
<pattern id="cf-grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#8aa8b8" stroke-width=".6" opacity=".14"/></pattern>
<linearGradient id="cf-top-lime" x2="0.8" y2="1"><stop stop-color="#d8f3a1"/><stop offset="1" stop-color="#72984f"/></linearGradient>
<linearGradient id="cf-front-lime" x2="0.8" y2="1"><stop stop-color="#748a59"/><stop offset="1" stop-color="#283b28"/></linearGradient>
<linearGradient id="cf-side-lime" x2="0.8" y2="1"><stop stop-color="#385243"/><stop offset="1" stop-color="#182821"/></linearGradient>
<linearGradient id="cf-top-teal" x2="0.8" y2="1"><stop stop-color="#9ce5d2"/><stop offset="1" stop-color="#3f7c80"/></linearGradient>
<linearGradient id="cf-front-teal" x2="0.8" y2="1"><stop stop-color="#4e8987"/><stop offset="1" stop-color="#173b40"/></linearGradient>
<linearGradient id="cf-side-teal" x2="0.8" y2="1"><stop stop-color="#315d68"/><stop offset="1" stop-color="#152b36"/></linearGradient>
<linearGradient id="cf-top-violet" x2="0.8" y2="1"><stop stop-color="#c9bdfc"/><stop offset="1" stop-color="#746399"/></linearGradient>
<linearGradient id="cf-front-violet" x2="0.8" y2="1"><stop stop-color="#7b6b9e"/><stop offset="1" stop-color="#322940"/></linearGradient>
<linearGradient id="cf-side-violet" x2="0.8" y2="1"><stop stop-color="#534465"/><stop offset="1" stop-color="#241f37"/></linearGradient>
<linearGradient id="cf-top-blue" x2="0.8" y2="1"><stop stop-color="#93c5fd"/><stop offset="1" stop-color="#3b6ea8"/></linearGradient>
<linearGradient id="cf-front-blue" x2="0.8" y2="1"><stop stop-color="#4b79ad"/><stop offset="1" stop-color="#1a3150"/></linearGradient>
<linearGradient id="cf-side-blue" x2="0.8" y2="1"><stop stop-color="#2b4e78"/><stop offset="1" stop-color="#122138"/></linearGradient>
</defs>

<rect width="800" height="480" fill="url(#cf-bg)"/><rect x="40" y="40" width="720" height="400" rx="4" fill="url(#cf-grid)"/>
<ellipse cx="400" cy="245" rx="300" ry="190" fill="url(#cf-halo)"/>
<ellipse cx="400" cy="378" rx="275" ry="44" fill="#060f16" opacity=".58"/>
<path d="M74 362 400 432 726 362M108 326 400 390 692 326" fill="none" stroke="#53748a" opacity=".24"/>

<path d="M214 156 Q268 186 308 220 M214 238 Q264 246 302 252 M214 316 Q268 302 308 280 M494 252 H584" fill="none" stroke="#72cfb4" stroke-width="2.5" stroke-dasharray="8 10" stroke-linecap="round" class="art-flow"/>

