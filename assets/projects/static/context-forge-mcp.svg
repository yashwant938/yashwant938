  <rect x="688" y="134" width="12" height="32" rx="3" fill="#d8f3a1"/>
  <text x="646" y="106" fill="#d8f3a1" font-family="Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="1.4" text-anchor="middle">-85% PACKED</text>
</g>

<g class="art-pulse">
  <circle cx="264" cy="144" r="4" fill="#93c5fd"/>
  <circle cx="536" cy="154" r="4" fill="#d8f3a1"/>
  <circle cx="536" cy="340" r="3.5" fill="#9ce5d2"/>
</g>

<text x="156" y="408" fill="#d4ddc9" font-family="Arial,sans-serif" font-size="16" letter-spacing="2" text-anchor="middle">CODE · LOGS · RAG</text>
<text x="400" y="424" fill="#e9f8d3" font-family="Arial,sans-serif" font-size="17" font-weight="700" letter-spacing="2.2" text-anchor="middle">CONTEXTFORGE MCP</text>
<text x="646" y="408" fill="#d4ddc9" font-family="Arial,sans-serif" font-size="16" letter-spacing="2" text-anchor="middle">U-ORDERED PACK</text>
</svg>