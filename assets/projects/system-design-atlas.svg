<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="sys-design-title sys-design-desc" class="standalone">
<title id="sys-design-title">System Design Mastery Atlas: interactive 2.5D HLD and LLD labs</title><desc id="sys-design-desc">An isometric distributed-systems topology showing a consistent hashing ring on the left, a three-node Raft quorum cluster at the center, and sharded cache and storage tiers on the right.</desc>
<defs>
<radialGradient id="sd-bg" cx="50%" cy="44%" r="75%"><stop stop-color="#173139"/><stop offset=".55" stop-color="#0f2027"/><stop offset="1" stop-color="#091318"/></radialGradient>
<radialGradient id="sd-halo"><stop stop-color="#74d9b2" stop-opacity=".19"/><stop offset="1" stop-color="#74d9b2" stop-opacity="0"/></radialGradient>
<pattern id="sd-grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#8aa8b0" stroke-width=".6" opacity=".14"/></pattern>
<linearGradient id="sd-top-lime" x2="0.8" y2="1"><stop stop-color="#d8f3a1"/><stop offset="1" stop-color="#72984f"/></linearGradient>
<linearGradient id="sd-front-lime" x2="0.8" y2="1"><stop stop-color="#748a59"/><stop offset="1" stop-color="#283b28"/></linearGradient>
<linearGradient id="sd-side-lime" x2="0.8" y2="1"><stop stop-color="#385243"/><stop offset="1" stop-color="#182821"/></linearGradient>
<linearGradient id="sd-top-teal" x2="0.8" y2="1"><stop stop-color="#9ce5d2"/><stop offset="1" stop-color="#3f7c80"/></linearGradient>
<linearGradient id="sd-front-teal" x2="0.8" y2="1"><stop stop-color="#4e8987"/><stop offset="1" stop-color="#173b40"/></linearGradient>
<linearGradient id="sd-side-teal" x2="0.8" y2="1"><stop stop-color="#315d68"/><stop offset="1" stop-color="#152b36"/></linearGradient>
<linearGradient id="sd-top-violet" x2="0.8" y2="1"><stop stop-color="#c9bdfc"/><stop offset="1" stop-color="#746399"/></linearGradient>
<linearGradient id="sd-front-violet" x2="0.8" y2="1"><stop stop-color="#7b6b9e"/><stop offset="1" stop-color="#322940"/></linearGradient>
<linearGradient id="sd-side-violet" x2="0.8" y2="1"><stop stop-color="#534465"/><stop offset="1" stop-color="#241f37"/></linearGradient>
<linearGradient id="sd-sky" x2="0.8" y2="1"><stop stop-color="#8ec5ff"/><stop offset="1" stop-color="#3a6ea5"/></linearGradient>
</defs>
<style>.standalone .art-float{animation:sd-float 4s ease-in-out 1}.standalone .art-pulse{animation:sd-pulse 4s ease-in-out 1}.standalone .art-flow{stroke-dasharray:8 10;animation:sd-flow 4s ease-in-out 1}@keyframes sd-float{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}@keyframes sd-pulse{0%,100%{opacity:1}50%{opacity:.5}}@keyframes sd-flow{0%,100%{stroke-dashoffset:0}50%{stroke-dashoffset:36}}@media(prefers-reduced-motion:reduce){.standalone .art-float,.standalone .art-pulse,.standalone .art-flow{animation:none!important}}</style>
<rect width="800" height="480" fill="url(#sd-bg)"/><rect x="40" y="40" width="720" height="400" rx="4" fill="url(#sd-grid)"/>
<ellipse cx="400" cy="242" rx="310" ry="190" fill="url(#sd-halo)"/>
<ellipse cx="400" cy="378" rx="285" ry="44" fill="#050e12" opacity=".58"/>
<path d="M74 362 400 432 726 362M108 326 400 390 692 326" fill="none" stroke="#53757d" opacity=".25"/>

<!-- Left Module: Consistent Hashing Ring -->
<g>
  <ellipse cx="154" cy="242" rx="84" ry="56" fill="#0d1e24" stroke="#6cc9b6" stroke-width="2.2" stroke-dasharray="7 6"/>
  <ellipse cx="154" cy="242" rx="56" ry="37" fill="none" stroke="#476e78" stroke-width="1.2" opacity=".7"/>
  <!-- Virtual nodes around ring -->
  <polygon points="154,176 168,185 154,194 140,185" fill="#d8f3a1" stroke="#223525" stroke-width="1.2"/>
  <polygon points="234,234 248,243 234,252 220,243" fill="#9ce5d2" stroke="#183234" stroke-width="1.2"/>
  <polygon points="154,289 168,298 154,307 140,298" fill="#c9bdfc" stroke="#2c2440" stroke-width="1.2"/>
  <polygon points="74,234 88,243 74,252 60,243" fill="#8ec5ff" stroke="#1b314d" stroke-width="1.2"/>
  <!-- Clockwise key routing arc -->
  <path d="M102 204 A72 48 0 0 1 206 204" fill="none" stroke="#d8f3a1" stroke-width="2.5" stroke-linecap="round" class="art-flow"/>
  <text x="154" y="247" fill="#d7eee8" font-family="Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="1.4" text-anchor="middle">vNODES</text>
</g>

<!-- Center Isometric Quorum Baseplate -->
<g>
  <polygon points="268,286 400,354 400,382 268,314" fill="url(#sd-front-violet)" stroke="#758f88" stroke-width="1.2" stroke-linejoin="round"/>
  <polygon points="400,354 532,286 532,314 400,382" fill="url(#sd-side-violet)" stroke="#4f656a" stroke-width="1.2" stroke-linejoin="round"/>
  <polygon points="400,218 532,286 400,354 268,286" fill="url(#sd-top-violet)" stroke="#d7ceff" stroke-width="1.2" stroke-linejoin="round"/>
  <polygon points="400,236 498,286 400,336 302,286" fill="#17242e" stroke="#6ca6a2" stroke-width="1.2" opacity=".9"/>
</g>

<!-- Animated Traffic Routing Lines (Ring -> Raft Cluster -> Storage) -->
<path d="M242 243 Q272 248 310 256 M490 256 Q536 246 582 246 M490 282 Q536 294 582 294" fill="none" stroke="#72cfb4" stroke-width="2.5" stroke-linecap="round" class="art-flow"/>

<!-- Center Floating 3-Node Raft Consensus Cluster -->
<g class="art-float">
  <!-- Quorum sync triangle connecting the 3 nodes -->
  <path d="M400 176 L342 254 L458 254 Z" fill="none" stroke="#d8f3a1" stroke-width="2" stroke-dasharray="5 5" opacity=".85"/>

  <!-- Leader Node (Top Center, Lime) -->
  <polygon points="366,154 400,172 400,218 366,200" fill="url(#sd-front-lime)" stroke="#789368" stroke-width="1.2" stroke-linejoin="round"/>
  <polygon points="400,172 434,154 434,200 400,218" fill="url(#sd-side-lime)" stroke="#4f655b" stroke-width="1.2" stroke-linejoin="round"/>
  <polygon points="400,136 434,154 400,172 366,154" fill="url(#sd-top-lime)" stroke="#ebfcc8" stroke-width="1.4" stroke-linejoin="round"/>
  <!-- Leader halo ring -->
  <ellipse cx="400" cy="122" rx="18" ry="8" fill="none" stroke="#d8f3a1" stroke-width="2" class="art-pulse"/>
  <text x="400" y="106" fill="#e9f8d3" font-family="Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="1.8" text-anchor="middle">LEADER · W+R&gt;N</text>

  <!-- Follower Node Left (Teal) -->
  <polygon points="308,244 342,262 342,298 308,280" fill="url(#sd-front-teal)" stroke="#789368" stroke-width="1.2" stroke-linejoin="round"/>
  <polygon points="342,262 376,244 376,280 342,298" fill="url(#sd-side-teal)" stroke="#4f655b" stroke-width="1.2" stroke-linejoin="round"/>
  <polygon points="342,226 376,244 342,262 308,244" fill="url(#sd-top-teal)" stroke="#c3f3e6" stroke-width="1.2" stroke-linejoin="round"/>

  <!-- Follower Node Right (Teal) -->
  <polygon points="424,244 458,262 458,298 424,280" fill="url(#sd-front-teal)" stroke="#789368" stroke-width="1.2" stroke-linejoin="round"/>
  <polygon points="458,262 492,244 492,280 458,298" fill="url(#sd-side-teal)" stroke="#4f655b" stroke-width="1.2" stroke-linejoin="round"/>
  <polygon points="458,226 492,244 458,262 424,244" fill="url(#sd-top-teal)" stroke="#c3f3e6" stroke-width="1.2" stroke-linejoin="round"/>
</g>

<!-- Right Module: Sharded Cache + Storage Stack & 2.5D Lab Blueprint Card -->
<g>
  <!-- Bottom Shard Tier -->
  <polygon points="582,294 644,326 644,352 582,320" fill="url(#sd-front-teal)" stroke="#789368" stroke-width="1.2" stroke-linejoin="round"/>
  <polygon points="644,326 706,294 706,320 644,352" fill="url(#sd-side-teal)" stroke="#4f655b" stroke-width="1.2" stroke-linejoin="round"/>
  <polygon points="644,262 706,294 644,326 582,294" fill="url(#sd-top-teal)" stroke="#bddda0" stroke-width="1.2" stroke-linejoin="round"/>

  <!-- Middle LRU Cache Tier -->
  <polygon points="582,246 644,278 644,300 582,268" fill="url(#sd-front-lime)" stroke="#789368" stroke-width="1.2" stroke-linejoin="round"/>
  <polygon points="644,278 706,246 706,268 644,300" fill="url(#sd-side-lime)" stroke="#4f655b" stroke-width="1.2" stroke-linejoin="round"/>
  <polygon points="644,214 706,246 644,278 582,246" fill="url(#sd-top-lime)" stroke="#e4f8be" stroke-width="1.2" stroke-linejoin="round"/>

  <!-- Floating Top Telemetry Pill Card -->
  <g class="art-float">
    <rect x="576" y="114" width="136" height="72" rx="12" fill="#132931" stroke="#8ec5ff" stroke-width="1.8"/>
    <text x="644" y="142" fill="#d8f3a1" font-family="Arial,sans-serif" font-size="14" font-weight="700" letter-spacing="1.4" text-anchor="middle">100 LESSONS</text>
    <rect x="594" y="156" width="100" height="6" rx="3" fill="#21424c"/>
    <rect x="594" y="156" width="76" height="6" rx="3" fill="url(#sd-sky)"/>
    <text x="644" y="176" fill="#9ce5d2" font-family="Arial,sans-serif" font-size="11" letter-spacing="1.2" text-anchor="middle">HLD · LLD · LABS</text>
  </g>
</g>

<!-- Pulse Telemetry Accents -->
<g class="art-pulse">
  <circle cx="268" cy="148" r="4" fill="#8ec5ff"/>
  <circle cx="534" cy="162" r="4" fill="#d8f3a1"/>
  <circle cx="242" cy="346" r="3.5" fill="#c9bdfc"/>
</g>

<!-- Bottom Captions -->
<text x="154" y="408" fill="#d4ddc9" font-family="Arial,sans-serif" font-size="16" letter-spacing="2" text-anchor="middle">HASH RING</text>
<text x="400" y="424" fill="#e9f8d3" font-family="Arial,sans-serif" font-size="17" font-weight="700" letter-spacing="2.2" text-anchor="middle">SYSTEM DESIGN ATLAS</text>
<text x="644" y="408" fill="#d4ddc9" font-family="Arial,sans-serif" font-size="16" letter-spacing="2" text-anchor="middle">6 LIVE LABS</text>
</svg>