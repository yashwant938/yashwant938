<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="306" viewBox="0 0 1200 306" role="img" aria-labelledby="title desc">
  <title id="title">From issue to pull request</title>
  <desc id="desc">An animated illustration of my contribution workflow: reproduce, patch, verify, and open a pull request. The linked PRs provide the actual contribution status and test results.</desc>
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="0.85" fill="#151514" opacity="0.06"/>
    </pattern>
  </defs>
  <style>
    .signal { animation: travel 12s ease-in-out infinite; }
    .halo { animation: breathe 12s ease-in-out infinite; opacity: .16; transform-box: fill-box; transform-origin: center; }
    .h2 { animation-delay: 3s; } .h3 { animation-delay: 6s; } .h4 { animation-delay: 9s; }
    @keyframes travel {
      0%, 6% { transform: translateX(0); opacity: 0; }
      10% { transform: translateX(0); opacity: 1; }
      30%, 35% { transform: translateX(300px); opacity: 1; }
      55%, 60% { transform: translateX(600px); opacity: 1; }
      80%, 88% { transform: translateX(900px); opacity: 1; }
      94%, 100% { transform: translateX(900px); opacity: 0; }
    }
    @keyframes breathe {
      0%, 8%, 35%, 100% { opacity: .14; transform: scale(1); }
      18%, 25% { opacity: .55; transform: scale(1.16); }
    }
    @media (prefers-reduced-motion: reduce) { .signal { display: none; } .halo { animation: none; } }
  </style>

  <!-- Warm Archival Paper Canvas -->
  <rect x="1" y="1" width="1198" height="304" rx="12" fill="#F6F4EF" stroke="#C8C3B6" stroke-width="2"/>
  <rect x="2" y="2" width="1196" height="302" rx="11" fill="url(#grid)"/>
  <line x1="42" y1="24" x2="1158" y2="24" stroke="#D5D0C5" stroke-width="1.5"/>
  <rect x="42" y="22.5" width="72" height="3" fill="#B83A2A"/>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif">
    <circle cx="48" cy="46" r="4" fill="#B83A2A"/>
    <text x="60" y="50" fill="#B83A2A" font-family="Consolas, 'JetBrains Mono', monospace" font-size="12" font-weight="700" letter-spacing="1.4">OPEN SOURCE · ENGINEERING WORKFLOW</text>
    <text x="42" y="86" fill="#151514" font-size="28" font-weight="800" letter-spacing="-0.6">Small changes. A clear trail of evidence.</text>
  </g>

  <!-- Step Rail -->
  <path d="M150 156H1050" fill="none" stroke="#CFCAC0" stroke-width="2"/>
  <path d="M150 156H1050" fill="none" stroke="#B83A2A" stroke-width="2" stroke-dasharray="3 9" opacity="0.5"/>

  <!-- Animated Signal Pulse -->
  <g class="signal">
    <circle cx="150" cy="156" r="11" fill="#B83A2A" opacity="0.22"/>
    <circle cx="150" cy="156" r="4.5" fill="#B83A2A"/>
  </g>

  <!-- Breathing Halos -->
  <g fill="none" stroke-width="1.5">
    <circle class="halo" cx="150" cy="156" r="34" stroke="#B83A2A"/>
    <circle class="halo h2" cx="450" cy="156" r="34" stroke="#151514"/>
    <circle class="halo h3" cx="750" cy="156" r="34" stroke="#1F5178"/>
    <circle class="halo h4" cx="1050" cy="156" r="34" stroke="#1E6B45"/>
  </g>

  <!-- Step Nodes -->
  <g fill="#FAF9F5" stroke-width="2">
    <circle cx="150" cy="156" r="25" stroke="#B83A2A"/>
    <circle cx="450" cy="156" r="25" stroke="#151514"/>
    <circle cx="750" cy="156" r="25" stroke="#1F5178"/>
    <circle cx="1050" cy="156" r="25" stroke="#1E6B45"/>
  </g>

  <!-- Node Icons -->
  <g fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <g stroke="#B83A2A"><circle cx="147" cy="153" r="7"/><path d="m152 158 7 7"/></g>
    <g stroke="#151514"><circle cx="450" cy="156" r="6"/><path d="M437 156h7m12 0h7"/></g>
    <path d="m741 156 6 6 12-13" stroke="#1F5178"/>
    <g stroke="#1E6B45"><circle cx="1043" cy="147" r="3"/><circle cx="1043" cy="165" r="3"/><circle cx="1057" cy="165" r="3"/><path d="M1043 150v12m14 0v-9q0-6-7-6m2-3-3 3 3 3"/></g>
  </g>

  <!-- Step Captions -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" text-anchor="middle">
    <g fill="#706D65" font-family="Consolas, 'JetBrains Mono', monospace" font-size="11" font-weight="700" letter-spacing="0.8">
      <text x="150" y="210">STEP 01</text>
      <text x="450" y="210">STEP 02</text>
      <text x="750" y="210">STEP 03</text>
      <text x="1050" y="210">STEP 04</text>
    </g>
    <g fill="#151514" font-size="20" font-weight="800" letter-spacing="-0.3">
      <text x="150" y="234">Reproduce</text>
      <text x="450" y="234">Patch</text>
      <text x="750" y="234">Verify</text>
      <text x="1050" y="234">Pull Request</text>
    </g>
    <g fill="#57554F" font-size="14.5">
      <text x="150" y="258">Isolate the failure</text>
      <text x="450" y="258">Make a focused change</text>
      <text x="750" y="258">Test before and after</text>
      <text x="1050" y="258">Share code + evidence</text>
    </g>
  </g>
</svg>
